name: go test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  GENERATOR_DOCKER_CACHE_VERSION: "v1"
  GOPRIVATE: "github.com/goforj/*"
  GONOPROXY: "none"
  WIRE_INSTALL_TARGET: "github.com/goforj/wire/cmd/wire@v1.2.0"

jobs:
  vue-starter:
    name: vue starter
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/starter-kits/vue/frontend/package-lock.json

      - name: install Vue starter dependencies
        working-directory: templates/starter-kits/vue/frontend
        run: npm ci --prefer-offline --no-audit

      - name: test Vue starter build graph
        run: node --test internal/forj/frontendtest/vue_starter_build.test.mjs

  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # The full suite owns this key so faster jobs cannot publish a partial immutable cache first.
      - name: cache go test dependencies and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: test-go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ env.WIRE_INSTALL_TARGET }}-${{ hashFiles('go.mod', 'go.sum', 'internal/coredeps/modules.go') }}
          restore-keys: |
            test-go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ env.WIRE_INSTALL_TARGET }}-
            test-go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
            test-go-${{ runner.os }}-

      - name: install wire
        run: go install "$WIRE_INSTALL_TARGET"

      - name: run go tests
        run: go test ./... -count=1 -v

      - name: build goforj binary
        run: go install ./cmd/forj

  platform:
    name: platform (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: compile root packages and tests
        run: go test -run '^$' ./...

      - name: run platform-sensitive tests
        run: go test -count=1 ./internal/devwatch ./internal/build ./internal/envfile ./internal/projectlayout ./internal/testexec ./project

      - name: run dev command tests
        run: go test -count=1 ./internal/forj -run '^TestDev'

      - name: run portable build-herd stress test
        run: go test -tags=watcherstress -count=1 -timeout=5m ./internal/forj -run '^TestDevWatcherBuildThunderingHerd$'

  watcher-stress:
    name: watcher churn (race)
    runs-on: ubuntu-latest
    env:
      GOCACHE: /tmp/gocache
      GOMODCACHE: /tmp/gomodcache

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            internal/coredeps/modules.go

      - name: run watcher concurrency stress tests
        run: |
          set -euo pipefail
          devwatch_tests="$(go test ./internal/devwatch -list '^TestDevWatchEngineSustainedEditorStormCoalesces$')"
          grep -qx 'TestDevWatchEngineSustainedEditorStormCoalesces' <<<"$devwatch_tests"
          build_tests="$(go test ./internal/build -list '^TestConcurrentAtomicBuildPublicationNeverLaunchesPartialBinary$')"
          grep -qx 'TestConcurrentAtomicBuildPublicationNeverLaunchesPartialBinary' <<<"$build_tests"
          go test -race ./internal/devwatch ./internal/build \
            -run '^Test(DevWatchEngineSustainedEditorStormCoalesces|ConcurrentAtomicBuildPublicationNeverLaunchesPartialBinary)$' \
            -count=3 -timeout=15m -v

      - name: run forj dev churn integration test
        run: |
          set -euo pipefail
          test_pattern='^TestDevWatcher(BuildThunderingHerd|ChurnIntegration|PollingStress|Boundary(RejectedReplacementKeepsHealthyRuntime|PostPreparationStartFailureRetries|RelativeCommandDirectoryLaunchesPreparedSnapshot|ShutdownCancelsBlockedBuild|ChangeDuringRuntimeReplacementConverges)|MultiAppChurnIsolation|OutputBackpressureReapsProcesses|InitialInvalidProjectRecovers)$'
          discovered="$(go test -tags=watcherstress ./internal/forj -list "$test_pattern")"
          for test_name in \
            TestDevWatcherChurnIntegration \
            TestDevWatcherBuildThunderingHerd \
            TestDevWatcherPollingStress \
            TestDevWatcherBoundaryRejectedReplacementKeepsHealthyRuntime \
            TestDevWatcherBoundaryPostPreparationStartFailureRetries \
            TestDevWatcherBoundaryRelativeCommandDirectoryLaunchesPreparedSnapshot \
            TestDevWatcherBoundaryShutdownCancelsBlockedBuild \
            TestDevWatcherBoundaryChangeDuringRuntimeReplacementConverges \
            TestDevWatcherMultiAppChurnIsolation \
            TestDevWatcherOutputBackpressureReapsProcesses \
            TestDevWatcherInitialInvalidProjectRecovers
          do
            grep -qx "$test_name" <<<"$discovered"
          done
          go test -race -tags=watcherstress ./internal/forj \
            -run "$test_pattern" \
            -count=1 -timeout=15m -v

      - name: record watcher coordination benchmarks
        run: go test ./internal/forj -run '^$' -bench '^BenchmarkDevWatcherBuildGate' -benchmem -count=3

  renders:
    needs: renders-cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      CLICOLOR_FORCE: "1"
      FORJ_DEBUG: "1"
      # FORJ_RENDER_TIMINGS: "1"
      FORJ_TEST_RENDERS_WORKERS: "2"
      FORJ_TEST_RENDERS_SHARD_COUNT: "6"
      FORJ_TEST_RENDERS_SHARD_INDEX: ${{ matrix.shard }}

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: restore go cache (renders)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ env.WIRE_INSTALL_TARGET }}-${{ hashFiles('go.mod', 'go.sum', 'internal/coredeps/modules.go', 'scripts/generate-renderwarm.sh', 'templates/**/*.go.tmpl', 'templates/embed.go', 'tools/renderwarm/go.mod', 'tools/renderwarm/go.sum', 'tools/renderwarm/main.go') }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ env.WIRE_INSTALL_TARGET }}-
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: install wire
        run: go install "$WIRE_INSTALL_TARGET"

      - name: build goforj binary
        run: go install ./cmd/forj

      - name: run forj test-renders shard
        run: forj test:renders --profile=pr --run-tests

  renders-cache:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: cache go modules/build (renders seed)
        id: render-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ env.WIRE_INSTALL_TARGET }}-${{ hashFiles('go.mod', 'go.sum', 'internal/coredeps/modules.go', 'scripts/generate-renderwarm.sh', 'templates/**/*.go.tmpl', 'templates/embed.go', 'tools/renderwarm/go.mod', 'tools/renderwarm/go.sum', 'tools/renderwarm/main.go') }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ env.WIRE_INSTALL_TARGET }}-
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: verify renderwarm generation
        run: |
          bash scripts/generate-renderwarm.sh
          git diff --exit-code -- tools/renderwarm/go.mod tools/renderwarm/go.sum tools/renderwarm/main.go

      # Exact cache hits are immutable, so rebuilding them cannot help the shards.
      - name: seed go caches
        if: steps.render-cache.outputs.cache-hit != 'true'
        run: |
          go mod download
          go install "$WIRE_INSTALL_TARGET"
          go install ./cmd/forj
          cd tools/renderwarm
          GOWORK=off go mod tidy
          GOWORK=off go build .

  integration-shards:
    name: integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: framework 1/6
            args: framework --shard=1/6
          - name: framework 2/6
            args: framework --shard=2/6
          - name: framework 3/6
            args: framework --shard=3/6
          - name: framework 4/6
            args: framework --shard=4/6
          - name: framework 5/6
            args: framework --shard=5/6
          - name: framework 6/6
            args: framework --shard=6/6
          - name: multi-app
            args: framework --framework-profile=multiapp
          - name: rendered sqlite
            args: rendered --variant=sqlite
          - name: rendered mysql
            args: rendered --variant=mysql
          - name: rendered postgres
            args: rendered --variant=postgres
    env:
      CLICOLOR_FORCE: "1"

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            internal/coredeps/modules.go

      - name: verify docker runtime
        run: |
          docker info >/dev/null
          docker compose version >/dev/null

      - name: install wire
        run: go install "$WIRE_INSTALL_TARGET"

      - name: build goforj binary
        run: go build -o "$RUNNER_TEMP/forj" ./cmd/forj

      - name: run integration shard
        env:
          FORJ_INTEGRATION_FORJ_PATH: ${{ runner.temp }}/forj
        run: '"$FORJ_INTEGRATION_FORJ_PATH" test:integration ${{ matrix.args }} -v'

  integration:
    name: integration
    if: ${{ always() }}
    needs: integration-shards
    runs-on: ubuntu-latest
    steps:
      - name: require every integration shard
        env:
          SHARD_RESULT: ${{ needs.integration-shards.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "One or more integration shards failed: $SHARD_RESULT"
            exit 1
          fi

  lighthouse-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLICOLOR_FORCE: "1"
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            internal/coredeps/modules.go

      - name: verify docker runtime
        run: |
          docker info >/dev/null
          docker compose version >/dev/null

      - name: install wire
        run: go install "$WIRE_INSTALL_TARGET"

      - name: build goforj binary
        run: go build -o "$RUNNER_TEMP/forj" ./cmd/forj

      - name: run lighthouse integration tests
        env:
          FORJ_INTEGRATION_FORJ_PATH: ${{ runner.temp }}/forj
        run: '"$FORJ_INTEGRATION_FORJ_PATH" test:integration framework --framework-profile=lighthouse -v'

  backup-integration:
    name: backup and restore integration
    runs-on: ubuntu-latest
    env:
      GOCACHE: /tmp/gocache
      GOMODCACHE: /tmp/gomodcache
      GOFORJ_BACKUP_INTEGRATION: "1"

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            integration/go.sum
            internal/coredeps/modules.go

      - name: verify docker runtime
        run: docker info

      - name: verify native database clients
        run: |
          for client in mysql mysqldump psql pg_dump; do
            command -v "$client" >/dev/null
          done

      - name: install wire
        run: go install "$WIRE_INSTALL_TARGET"

      - name: download integration modules
        working-directory: integration
        run: GOWORK=off go mod download

      - name: validate generated app resource contract
        run: |
          GOCACHE=/tmp/gocache GOMODCACHE=/tmp/gomodcache \
            go run ./cmd/forj --dev test:render --silent

      - name: run portable matrix and native sqlite/mysql recovery
        working-directory: integration
        run: |
          GOWORK=off go test -tags=integration_backup ./... \
            -run 'TestPortableTransferMatrix|TestPortableCompatibilityFailures|TestNativeSQLiteBackupRestore|TestNativeMySQLBackupRestore' \
            -count=1 -v

      # Postgres native recovery runs separately because its container lifecycle
      # must not overlap with the broader transfer matrix in this test suite.
      - name: run native postgres recovery
        working-directory: integration
        env:
          GOFORJ_BACKUP_NATIVE_POSTGRES: "1"
        run: |
          GOWORK=off go test -tags=integration_backup ./... \
            -run '^TestNativePostgresBackupRestore$' \
            -count=1 -v

  uptime-gopher-demo:
    name: uptime gopher (demo)
    runs-on: ubuntu-latest
    env:
      CLICOLOR_FORCE: "1"
      UPTIME_GOPHER_DEMO_DIR: /tmp/goforj_monitoring_verify

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            internal/coredeps/modules.go

      - name: set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/demo/frontend/package-lock.json

      - name: install wire
        run: go install "$WIRE_INSTALL_TARGET"

      - name: build goforj binary
        run: go build -o "$RUNNER_TEMP/forj" ./cmd/forj

      - name: render demo app
        run: |
          set -euo pipefail
          rm -rf "${UPTIME_GOPHER_DEMO_DIR}"
          mkdir -p "${UPTIME_GOPHER_DEMO_DIR}"
          cat > "${UPTIME_GOPHER_DEMO_DIR}/.goforj.yml" <<'YAML'
          project_name: DemoMonitoringVerify
          module_name: example.com/demomonitoringverify
          updated_at: "2026-04-18 00:00:00 UTC"
          dev:
            pre: []
            down: []
            auto_migrate: false
            down_on_exit: false
            sound_on_watch_error: false
            wire_paths: []
            watches: []
          render:
            components:
              cli: false
              demo_app: true
              auth: false
              web_api: true
              web_ui: true
              docker: false
              database_mysql: false
              database_postgres: false
              database_sqlite: true
              scheduler: true
              jobs: true
              stress_test: false
            goforj_version: ""
          YAML
          cd "${UPTIME_GOPHER_DEMO_DIR}"
          "$RUNNER_TEMP/forj" render

      - name: run demo backend monitoring tests
        run: |
          set -euo pipefail
          cd "${UPTIME_GOPHER_DEMO_DIR}"
          go test ./internal/monitoring -count=1 -v

      - name: run demo frontend monitoring tests
        run: |
          set -euo pipefail
          cd "${UPTIME_GOPHER_DEMO_DIR}/cmd/app/frontend"
          npm ci --prefer-offline --no-audit
          npm run test:monitoring-ui

  generator-integration:
    runs-on: ubuntu-latest
    env:
      CLICOLOR_FORCE: "1"
      GOCACHE: ${{ github.workspace }}/.cache/generator-go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/generator-go-mod

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: restore generator integration go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: generator-go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum', 'go.mod', 'integration/go.sum', 'integration/go.mod', 'internal/coredeps/modules.go') }}
          restore-keys: |
            generator-go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: verify docker runtime
        run: docker info >/dev/null

      - name: restore docker image cache
        id: generator-docker-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/generator-docker-images
          key: generator-docker-${{ runner.os }}-${{ env.GENERATOR_DOCKER_CACHE_VERSION }}-${{ hashFiles('.github/generator-integration-images.txt') }}
          restore-keys: |
            generator-docker-${{ runner.os }}-${{ env.GENERATOR_DOCKER_CACHE_VERSION }}-
            generator-docker-${{ runner.os }}-

      - name: load cached docker images
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/generator-docker-images"
          if [ ! -d "$cache_dir" ]; then
            exit 0
          fi
          shopt -s nullglob
          for archive in "$cache_dir"/*.tar; do
            docker load -i "$archive"
          done

      - name: prime docker images for generator integration
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/generator-docker-images"
          mkdir -p "$cache_dir"
          mapfile -t images < .github/generator-integration-images.txt
          for image in "${images[@]}"; do
            docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"
            archive_name="$(echo "$image" | tr '/:' '__').tar"
            if [ ! -f "$cache_dir/$archive_name" ]; then
              docker save "$image" -o "$cache_dir/$archive_name"
            fi
          done

      - name: validate and download go modules
        run: |
          cd integration
          GOWORK=off go mod tidy -diff
          GOWORK=off go mod download

      - name: run generator integration smoke tests
        run: |
          set -euo pipefail
          cd integration
          GOWORK=off go test -tags=integration_generator ./... -run 'TestGenerate(Cache|Storage)FilesIntegrationSmoke' -count=1 -v
